<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾光集 · 每日一图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8E2D6; --ink:#5C4A36; --gold:#D4A574;
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#100D0A;font-family:var(--sans);overflow:hidden}

/* ─── 顶部：今日 / 往期 / 日期 ─── */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
  padding:26px 56px;
  background:linear-gradient(to bottom,rgba(10,8,6,.6),rgba(10,8,6,0));}
.top .item{color:rgba(255,252,245,.92);font-weight:300;font-size:15px;letter-spacing:4px;
  cursor:pointer;user-select:none;transition:color .25s;position:relative;padding:6px 0}
.top .item:hover{color:#fff}
.top .item.active::after{content:'';position:absolute;left:0;right:4px;bottom:-2px;height:1px;background:var(--gold)}
.top .date{margin-left:auto;letter-spacing:2px;font-weight:300;font-size:13px;color:rgba(255,252,245,.75);cursor:default}
.top .sep{width:1px;height:14px;background:rgba(255,252,245,.35);margin:0 26px}

/* ─── 全屏舞台：完整展示不裁剪 ─── */
.stage{position:fixed;inset:0;background:
  radial-gradient(ellipse at center,rgba(30,24,18,.5),#100D0A 78%)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s}
.stage img.show{opacity:1;visibility:visible}
.stage .veil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(10,8,6,.3) 0,rgba(10,8,6,0) 20%)}

/* ─── 文字块：底部渐变衬底上渐入 ─── */
.caption{position:absolute;left:0;right:0;bottom:0;z-index:6;
  padding:120px 72px 58px;pointer-events:none;
  background:linear-gradient(to top,rgba(8,6,4,.88) 0%,rgba(8,6,4,.55) 52%,rgba(8,6,4,0) 100%)}
.cap-inner{max-width:820px}
.cap-kicker{display:block;font-size:12px;letter-spacing:3px;font-weight:400;color:var(--gold);margin-bottom:14px}
.cap-title{font-family:var(--serif);font-weight:600;font-size:34px;line-height:46px;
  color:var(--paper);letter-spacing:1px;margin-bottom:16px}
.cap-desc{font-weight:300;font-size:14px;line-height:26px;color:rgba(232,226,214,.78);
  max-height:34vh;overflow-y:auto;padding-right:8px;pointer-events:auto}
.cap-desc::-webkit-scrollbar{width:3px}
.cap-desc::-webkit-scrollbar-thumb{background:rgba(232,226,214,.25);border-radius:2px}
.cap-meta{display:block;margin-top:18px;font-size:12px;letter-spacing:1.5px;
  font-weight:300;color:rgba(232,226,214,.55)}

/* 渐入动画：文字块逐层升起 */
.caption .fade{opacity:0;transform:translateY(22px)}
.caption.play .fade{animation:rise .9s cubic-bezier(.22,.61,.36,1) forwards}
.caption.play .fade.d1{animation-delay:.12s}
.caption.play .fade.d2{animation-delay:.26s}
.caption.play .fade.d3{animation-delay:.40s}
.caption.play .fade.d4{animation-delay:.54s}
@keyframes rise{to{opacity:1;transform:none}}

/* ─── 左右箭头 ─── */
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:15;width:52px;height:52px;
  border-radius:50%;border:1px solid rgba(255,252,245,.35);background:rgba(10,8,6,.30);
  color:rgba(255,252,245,.9);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .25s,border-color .25s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.arrow:hover{background:rgba(10,8,6,.55);border-color:rgba(255,252,245,.7)}
.arrow.left{left:34px}
.arrow.right{right:34px}

/* ─── 往期画廊 ─── */
.archive{position:fixed;inset:0;z-index:30;background:rgba(16,12,9,.96);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
.archive.open{opacity:1;visibility:visible}
.archive-inner{max-width:1080px;margin:0 auto;padding:110px 48px 90px}
.archive-title{font-family:var(--serif);font-weight:600;font-size:34px;color:var(--paper);letter-spacing:2px}
.archive-sub{color:rgba(232,226,214,.5);font-size:12px;letter-spacing:3px;font-weight:300;margin:14px 0 56px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:44px 36px}
.card{cursor:default;opacity:0}
.archive.open .card{animation:rise .8s cubic-bezier(.22,.61,.36,1) forwards}
.archive.open .card:nth-child(1){animation-delay:.15s}
.archive.open .card:nth-child(2){animation-delay:.30s}
.archive.open .card:nth-child(3){animation-delay:.45s}
.archive.open .card:nth-child(4){animation-delay:.60s}
.card .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:3px;
  filter:brightness(.92);transition:filter .3s,transform .3s}
.card:hover .ph{filter:brightness(1.05);transform:translateY(-3px)}
.card h3{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--paper);margin:20px 0 8px;letter-spacing:1px}
.card p{font-weight:300;font-size:13px;line-height:22px;color:rgba(232,226,214,.6)}
.card .tag{display:inline-block;margin-top:12px;font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:400}
.archive-close{position:fixed;top:26px;right:56px;z-index:31;color:rgba(255,252,245,.8);
  font-size:26px;cursor:pointer;transition:color .25s;line-height:1;font-weight:300}
.archive-close:hover{color:#fff}

/* ─── 灯箱预览（点击图片打开，可保存） ─── */
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(8,6,4,.94);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s}
.lightbox.open{opacity:1;visibility:visible}
.lightbox img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:2px;
  box-shadow:0 24px 80px rgba(0,0,0,.55);transform:scale(.96);transition:transform .35s ease}
.lightbox.open img{transform:scale(1)}
.lightbox .lb-bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;
  padding:20px 34px;background:linear-gradient(to bottom,rgba(8,6,4,.75),rgba(8,6,4,0))}
.lb-title{font-family:var(--serif);font-weight:500;font-size:16px;letter-spacing:1px;
  color:rgba(255,252,245,.9);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-close{color:rgba(255,252,245,.8);font-size:26px;cursor:pointer;line-height:1;
  font-weight:300;margin-left:22px;transition:color .25s}
.lb-close:hover{color:#fff}
.lb-save{margin-left:22px;padding:8px 22px;border-radius:20px;cursor:pointer;
  border:1px solid var(--gold);background:transparent;color:var(--gold);
  font-family:var(--sans);font-size:13px;letter-spacing:2px;font-weight:400;
  transition:background .25s,color .25s;white-space:nowrap}
.lb-save:hover{background:var(--gold);color:#1a140e}
.lb-hint{position:fixed;bottom:22px;left:0;right:0;text-align:center;
  font-size:11px;letter-spacing:2px;font-weight:300;color:rgba(232,226,214,.4);pointer-events:none}
.stage img.show{cursor:zoom-in}
.card .ph{cursor:zoom-in}

@media (max-width:760px){
  .top{padding:20px 24px}
  .caption{padding:90px 26px 46px}
  .cap-title{font-size:26px;line-height:36px}
  .grid{grid-template-columns:1fr}
  .archive-inner{padding:96px 28px 70px}
  .arrow.left{left:12px}.arrow.right{right:12px}
}
</style>
</head>
<body>

<!-- 顶部导航：今日 / 往期 / 日期 -->
<nav class="top">
  <span class="item active" id="navToday">今日</span>
  <span class="sep"></span>
  <span class="item" id="navArchive">往期</span>
  <span class="date" id="dateText"></span>
</nav>

<!-- 全屏图舞台（contain 完整展示）+ 文字块 -->
<div class="stage" id="stage">
  <div class="veil"></div>
  <div class="caption" id="caption">
    <div class="cap-inner">
      <span class="cap-kicker fade d1" id="capKicker"></span>
      <h1 class="cap-title fade d2" id="capTitle"></h1>
      <p class="cap-desc fade d3" id="capDesc"></p>
      <span class="cap-meta fade d4" id="capMeta"></span>
    </div>
  </div>
</div>
<button class="arrow left" id="prevBtn" aria-label="上一张">‹</button>
<button class="arrow right" id="nextBtn" aria-label="下一张">›</button>

<!-- 往期画廊 -->
<div class="archive" id="archive">
  <span class="archive-close" id="archiveClose" title="关闭">×</span>
  <div class="archive-inner">
    <h2 class="archive-title">往期回响</h2>
    <p class="archive-sub">ARCHIVE · 过往的每一帧</p>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- 灯箱预览：点击图片打开 -->
<div class="lightbox" id="lightbox">
  <div class="lb-bar">
    <span class="lb-title" id="lbTitle"></span>
    <button class="lb-save" id="lbSave">保存图片</button>
    <span class="lb-close" id="lbClose" title="关闭">×</span>
  </div>
  <img id="lbImg" alt="预览大图">
  <div class="lb-hint">点击空白处或按 Esc 关闭</div>
</div>

<script src="data.js"></script>
<script>
/* ─── 日期 ─── */
var DD=window.DAILY_DATA||{};
var d=new Date();
var dstr=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
document.getElementById('dateText').textContent=DD.date||dstr;

/* ─── 图片加载（多源递进，永不空白） ─── */
function loadImage(img,sources){
  var i=0;
  img.onerror=function(){i++;if(i<sources.length){img.src=sources[i];}};
  img.onload=function(){img.dataset.resolved=img.src};
  img.src=sources[0];
}

/* ─── 灯箱预览与保存 ─── */
var lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg'),lbTitle=document.getElementById('lbTitle');
function openLightbox(src,title){
  lbImg.src=src;lbTitle.textContent=title||'';
  lb.classList.add('open');
}
function closeLightbox(){lb.classList.remove('open')}
function currentSrcOf(img){return img.dataset.resolved||img.src}
function saveCurrent(){
  var src=lbImg.src;if(!src)return;
  var name=(lbTitle.textContent||'shiguangji').replace(/[\\/:*?"<>|]/g,'_').slice(0,60)+'.jpg';
  fetch(src).then(function(r){if(!r.ok)throw 0;return r.blob()})
    .then(function(b){
      var u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},4000);
    })
    .catch(function(){
      /* 跨域拿不到 blob 时，新开标签页手动右键保存 */
      window.open(src,'_blank');
    });
}
lbImg.addEventListener('click',function(e){e.stopPropagation()});
document.getElementById('lbClose').onclick=closeLightbox;
document.getElementById('lbSave').onclick=saveCurrent;
lb.addEventListener('click',closeLightbox);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&lb.classList.contains('open'))closeLightbox()});

/* ─── 今日轮播：图文一体，断网回退本地藏品 ─── */
var slides=[];
if(DD.nasa&&DD.nasa.src){
  slides.push({sources:[DD.nasa.src,'assets/images/3_36.jpeg'],
    kicker:'宇宙 · NASA 每日天文图',title:DD.nasa.title||'Astronomy Picture of the Day',
    desc:DD.nasa.desc||'',meta:DD.nasa.meta||''});
  if(DD.bing){slides.push({sources:[DD.bing.src,'assets/images/3_13.jpeg'],
    kicker:'人间 · Bing 每日一图',title:DD.bing.title||'Bing Daily',
    desc:DD.bing.desc||'',meta:DD.bing.meta||dstr});}
}
if(!slides.length){
  slides.push({sources:['assets/images/3_13.jpeg'],kicker:'今日 · 藏品',
    title:'大漠收尽最后一枚落日',desc:'黄昏六时许，鸣沙山的风忽然安静下来。驼队踏着沙脊缓缓西行，影子被落日拉得很长。',meta:'本馆藏品 · 第 321 期'});
  slides.push({sources:['assets/images/3_36.jpeg'],kicker:'宇宙 · 藏品',
    title:'银河低语',desc:'星光走了千年，才抵达城市之外的眼底。',meta:'本馆藏品 · 第 319 期'});
}

var stage=document.getElementById('stage');
var imgs=[];
slides.forEach(function(s,idx){
  var im=document.createElement('img');
  loadImage(im,s.sources);
  im.addEventListener('click',function(){openLightbox(currentSrcOf(im),s.title)});
  stage.insertBefore(im,document.getElementById('caption'));
  imgs.push(im);
});
var cur=0;
imgs[0].classList.add('show');

/* 文字块：随切换渐入 */
var caption=document.getElementById('caption');
function setCap(s){
  document.getElementById('capKicker').textContent=s.kicker;
  document.getElementById('capTitle').textContent=s.title;
  document.getElementById('capDesc').textContent=s.desc;
  document.getElementById('capMeta').textContent=s.meta;
}
function playCap(){
  caption.classList.remove('play');
  void caption.offsetWidth; /* 强制重排以重启动画 */
  caption.classList.add('play');
}
setCap(slides[0]);
playCap();

function go(n){
  imgs[cur].classList.remove('show');
  cur=(n+imgs.length)%imgs.length;
  imgs[cur].classList.add('show');
  setCap(slides[cur]);
  playCap();
}
document.getElementById('prevBtn').onclick=function(){go(cur-1)};
document.getElementById('nextBtn').onclick=function(){go(cur+1)};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
});

/* ─── 往期画廊（图文，逐卡渐入） ─── */
var past=[
  {img:'assets/images/3_33.jpeg',title:'巷口的旧茶馆',desc:'一壶茶，半个下午，和一整个旧时光。',tag:'人文 · 第 320 期'},
  {img:'assets/images/3_36.jpeg',title:'银河低语',desc:'星光走了千年，才抵达城市之外的眼底。',tag:'宇宙 · 第 319 期'},
  {img:'assets/images/3_46.jpeg',title:'雾未散尽',desc:'山径只露出三步远，其余的交给想象。',tag:'风景 · 第 318 期'},
  {img:'assets/images/3_52.jpeg',title:'雨夜灯河',desc:'路灯把湿漉漉的街道，铺成一条流动的河。',tag:'城市 · 第 317 期'}
];
var grid=document.getElementById('grid');
past.forEach(function(p){
  var c=document.createElement('div');c.className='card';
  c.innerHTML='<img class="ph" alt="'+p.title+'"><h3>'+p.title+'</h3><p>'+p.desc+'</p><span class="tag">'+p.tag+'</span>';
  var ph=c.querySelector('.ph');
  loadImage(ph,[p.img]);
  ph.addEventListener('click',function(){openLightbox(currentSrcOf(ph),p.title+' · '+p.tag)});
  grid.appendChild(c);
});

/* ─── 往期开合 ─── */
var archive=document.getElementById('archive');
document.getElementById('navArchive').onclick=function(){archive.classList.add('open')};
document.getElementById('archiveClose').onclick=function(){archive.classList.remove('open')};
document.getElementById('navToday').onclick=function(){archive.classList.remove('open')};
document.addEventListener('keydown',function(e){if(e.key==='Escape')archive.classList.remove('open')});
</script>
</body>
</html>
